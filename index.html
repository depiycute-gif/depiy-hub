<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De_piy Hub · 드피 허브</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --depiy-orange:#F8935F;
  --brand:var(--depiy-orange);
  --orange-soft:color-mix(in srgb,var(--depiy-orange) 16%,transparent);
  --orange-line:color-mix(in srgb,var(--depiy-orange) 55%,transparent);
  --orange-glow:color-mix(in srgb,var(--depiy-orange) 40%,transparent);
  --bg-0:#121214;
  --bg-1:#17171b;
  --bg-2:#1c1c20;
  --text:#ececf0;
  --text-dim:#a2a2ad;
  --text-mute:#71717d;
  --glass:rgba(255,255,255,.04);
  --glass-hi:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.08);
  --ok:#5fd38d;
  --warn:#e8c25a;
  --danger:#ff6b6b;
  --on-orange:#1a1209;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--text);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  background:radial-gradient(900px 520px at 72% -10%,color-mix(in srgb,var(--depiy-orange) 9%,transparent),transparent),var(--bg-0);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--depiy-orange);outline-offset:2px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 4열 레이아웃 ---------- */
.dp-app{display:grid;grid-template-columns:70px 240px minmax(0,1fr) 280px;height:100vh;height:100dvh;overflow:hidden}
.dp-app>*{min-height:0;min-width:0}

/* 스페이스 바 */
.spacebar{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;background:var(--bg-0);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.spacebar::-webkit-scrollbar{display:none}
.logo{width:46px;height:46px;border-radius:16px;background:var(--depiy-orange);color:var(--on-orange);font-weight:800;font-size:20px;box-shadow:0 8px 24px var(--orange-glow)}
.sep{width:28px;height:1px;background:var(--line);flex:none}
.space{position:relative;width:46px;height:46px;border-radius:50%;background:var(--glass-hi);font-size:21px;display:grid;place-items:center;transition:border-radius .2s,background .2s}
.space:hover{border-radius:16px}
.space.active{border-radius:16px;background:var(--orange-soft);box-shadow:inset 0 0 0 1.5px var(--orange-line)}
.space.active::before{content:"";position:absolute;left:-12px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--depiy-orange)}
.me-av{width:40px;height:40px;border-radius:50%;background:var(--glass-hi);display:grid;place-items:center;font-size:20px;flex:none}

/* 네비게이터 */
.nav{display:flex;flex-direction:column;background:rgba(255,255,255,.025);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line)}
.nav-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.nav-head h2{margin:0;font-size:16px;font-weight:800}
.nav-head p{margin:3px 0 0;font-size:12px;color:var(--text-dim)}
.nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 16px;scrollbar-width:thin}
.nav-scroll h3{margin:16px 6px 6px;font-size:11px;letter-spacing:.06em;color:var(--text-mute);font-weight:700}
.nav-item{position:relative;display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;color:var(--text-dim);text-align:left;font-size:14px}
.nav-item:hover{background:var(--glass-hi);color:var(--text)}
.nav-item.active{background:var(--orange-soft);color:var(--text);font-weight:700}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--depiy-orange)}
.ni{width:20px;text-align:center;flex:none}
.cnt{font-size:11px;color:var(--text-mute);flex:none}
.live-tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--depiy-orange);color:var(--on-orange);flex:none}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pdot.away{background:var(--warn)}
.pdot.off{background:var(--text-mute)}
.mini-av{width:22px;height:22px;border-radius:50%;background:var(--glass-hi);display:grid;place-items:center;font-size:13px;flex:none}
.nav-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex:none}
.nav-foot b{font-size:13px}
.nav-foot small{display:block;font-size:11px;color:var(--ok)}

/* 메인 */
.dp-main{display:flex;flex-direction:column;min-width:0}
.dp-top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(18,18,20,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex:none;min-height:64px}
.dp-top h1{margin:0;font-size:17px;font-weight:800}
.dp-top p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim)}
.menu-btn{display:none;width:38px;height:38px;border-radius:12px;background:var(--glass-hi);place-items:center;flex:none}
.dp-scroll{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 48px;scrollbar-width:thin}
.col{max-width:720px;margin:0 auto}

/* 작성기 */
.composer{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:14px;margin-bottom:16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.composer textarea{width:100%;resize:none;background:transparent;border:0;outline:none;font-size:15px;line-height:1.6;min-height:48px}
.composer textarea::placeholder{color:var(--text-mute)}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.composer-foot small{color:var(--text-mute);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--glass-hi);display:grid;place-items:center;font-size:20px;flex:none}
.btn{padding:8px 18px;border-radius:999px;background:var(--depiy-orange);color:var(--on-orange);font-weight:800;font-size:13px;transition:transform .15s,box-shadow .15s}
.btn:hover{box-shadow:0 6px 20px var(--orange-glow)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass-hi);color:var(--text)}

/* 포스트 */
.post{padding:16px;margin-bottom:12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.post.fresh{animation:fresh .7s ease-out}
@keyframes fresh{from{opacity:0;transform:translateY(-10px);box-shadow:0 0 0 2px var(--orange-line),0 0 34px var(--orange-glow)}to{opacity:1;transform:none;box-shadow:0 0 0 0 transparent}}
.echo-src{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line);font-size:12px;color:var(--text-dim)}
.echo-src svg{width:15px;height:15px;fill:none;stroke:var(--depiy-orange);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.echo-src b{color:var(--text)}
.post-head{display:flex;align-items:center;gap:10px}
.post-head b{font-size:14.5px}
.post-head small{display:block;color:var(--text-mute);font-size:12px}
.post-body{margin:12px 0 10px;font-size:15px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid transparent;color:var(--text-dim);font-size:13px;transition:background .15s,color .15s,border-color .15s}
.act:hover{background:var(--glass-hi);color:var(--text)}
.act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.on{color:var(--depiy-orange);background:var(--orange-soft);border-color:var(--orange-line)}
.act.spark.on svg{fill:var(--depiy-orange)}
.act.echo.on svg circle{fill:var(--depiy-orange)}
.act.echo.on svg{filter:drop-shadow(0 0 4px var(--orange-glow))}
.act.pop svg{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-10deg)}100%{transform:scale(1)}}
.live-pill{display:none;font-style:normal;font-size:9px;font-weight:800;padding:1px 5px;border-radius:999px;background:var(--depiy-orange);color:var(--on-orange)}
.act.thread.on .live-pill{display:inline}
.empty{padding:40px 10px;text-align:center;color:var(--text-mute);font-size:14px}

/* 스트림 / 라이브 스레드 */
.thread-panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stream-wrap{position:relative}
.stream{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 4px 2px 0;scrollbar-width:thin}
.msg{display:flex;gap:8px;align-items:flex-start;animation:msgin .25s ease-out}
@keyframes msgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .av{width:30px;height:30px;font-size:16px}
.bub{min-width:0;max-width:85%}
.meta{display:flex;gap:6px;align-items:baseline;font-size:12px}
.meta time{color:var(--text-mute);font-size:11px}
.bub p{margin:3px 0 0;display:inline-block;max-width:100%;padding:7px 12px;border-radius:4px 14px 14px 14px;background:var(--glass-hi);font-size:14px;line-height:1.5;word-break:break-word;text-align:left}
.msg.mine{flex-direction:row-reverse}
.msg.mine .meta{justify-content:flex-end}
.msg.mine .bub{text-align:right}
.msg.mine .bub p{border-radius:14px 4px 14px 14px;background:var(--orange-soft);border:1px solid var(--orange-line)}
.msg.sys{justify-content:center}
.msg.sys span{font-size:12px;color:var(--text-mute);padding:3px 10px;border-radius:999px;background:var(--glass)}
.jump{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:var(--depiy-orange);color:var(--on-orange);font-weight:800;font-size:12px;box-shadow:0 6px 20px var(--orange-glow);z-index:2}
.send{display:flex;gap:8px;margin-top:10px}
.send input{flex:1;min-width:0;padding:9px 15px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;outline:none}
.send input:focus-visible{border-color:var(--orange-line);outline:2px solid var(--depiy-orange);outline-offset:1px}
.send input::placeholder{color:var(--text-mute)}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--depiy-orange);color:var(--on-orange);display:grid;place-items:center;flex:none}
.send-btn svg{width:17px;height:17px}

/* DM */
.dm-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px 18px;max-width:760px;width:100%;margin:0 auto}
.dm-wrap .stream-wrap{flex:1;min-height:0;display:flex}
.dm-wrap .stream{flex:1;max-height:none;padding:18px 4px 8px 0}

/* 에코 메뉴 */
.echo-menu{position:fixed;z-index:80;min-width:200px;padding:6px;border-radius:14px;background:rgba(28,28,32,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55);animation:msgin .15s ease-out}
.em-title{margin:6px 10px 6px;font-size:11px;color:var(--text-mute);font-weight:700}
.echo-menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:9px;font-size:14px;text-align:left}
.echo-menu button:hover,.echo-menu button:focus-visible{background:var(--orange-soft)}
.echo-menu small{color:var(--depiy-orange);font-size:11px}

/* 파티클 / 파동 */
.dp-p{position:fixed;z-index:100;pointer-events:none;border-radius:999px;background:var(--depiy-orange);box-shadow:0 0 8px var(--orange-glow)}
.dp-p.alt{background:color-mix(in srgb,var(--depiy-orange) 50%,#fff)}
.dp-flash{position:fixed;z-index:99;width:44px;height:44px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--orange-glow),transparent 70%)}
.dp-ripple{position:fixed;z-index:99;width:40px;height:40px;border-radius:50%;pointer-events:none;border:2px solid var(--depiy-orange)}

/* 라이브 위젯 */
.widget{overflow-y:auto;padding:18px 16px 28px;background:rgba(255,255,255,.02);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid var(--line);scrollbar-width:thin}
.widget section{margin-bottom:22px}
.widget h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:12px;letter-spacing:.04em;color:var(--text-dim);font-weight:700}
.widget h3 em{font-style:normal;color:var(--text-mute);font-weight:500}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wuser{display:flex;align-items:center;gap:10px;font-size:13.5px}
.wuser small{display:block;font-size:11px;color:var(--text-mute)}
.lounge-card{padding:12px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.lounge-card.joined{border-color:var(--orange-line);background:var(--orange-soft)}
.lounge-card b{font-size:13.5px}
.lounge-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.stack{display:flex}
.stack .mini-av{margin-left:-6px;border:2px solid var(--bg-1);width:26px;height:26px}
.stack .mini-av:first-child{margin-left:0}
.btn.sm{padding:6px 13px;font-size:12px}
.trend{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line)}
.trend b{color:var(--depiy-orange);font-size:12px;white-space:nowrap}
.trend p{margin:0;font-size:12.5px;line-height:1.45;color:var(--text)}
.trend small{display:block;margin-top:3px;font-size:11px;color:var(--text-mute)}

/* 플로팅 라운지 HUD */
.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 20px);padding:8px 10px 8px 16px;border-radius:999px;background:rgba(28,28,32,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--orange-line);box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 0 4px color-mix(in srgb,var(--depiy-orange) 8%,transparent);animation:msgin .25s ease-out}
.hud-info{display:flex;align-items:center;gap:10px;flex:none}
.hud-info b{display:block;font-size:13px;white-space:nowrap}
.hud-info small{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--depiy-orange);box-shadow:0 0 0 0 var(--orange-glow);animation:livedot 1.6s infinite;flex:none}
@keyframes livedot{0%{box-shadow:0 0 0 0 var(--orange-glow)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hud-people{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.hud-people::-webkit-scrollbar{display:none}
.hud-p{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.hud-p small{font-size:10px;color:var(--text-dim)}
.mutedmark{position:absolute;top:-4px;right:-6px;font-style:normal;font-size:11px}
.ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass-hi);border:2px solid transparent;font-size:18px;transition:border-color .2s,box-shadow .2s;flex:none}
.ring.speaking{border-color:var(--depiy-orange);animation:ring 1.1s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 2px var(--orange-glow)}50%{box-shadow:0 0 0 7px transparent}}
.hud-btns{display:flex;gap:6px;flex:none}
.hud-btn{width:36px;height:36px;border-radius:50%;background:var(--glass-hi);display:grid;place-items:center}
.hud-btn svg{width:17px;height:17px}
.hud-btn.off{background:color-mix(in srgb,var(--danger) 25%,transparent);color:var(--danger)}
.hud-btn.leave{background:color-mix(in srgb,var(--danger) 85%,#000);color:#fff}

/* 워치파티 */
.watch-wrap{container-type:inline-size}
.watch-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@container (max-width:760px){.watch-grid{grid-template-columns:1fr}}
.player{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0b0b0d;border:1px solid var(--line);display:grid;place-items:center}
.player-bg{position:absolute;inset:-20%;filter:blur(32px);background:radial-gradient(circle at 30% 40%,var(--orange-glow),transparent 45%),radial-gradient(circle at 75% 65%,rgba(120,140,255,.25),transparent 50%);animation:drift 12s ease-in-out infinite alternate;animation-play-state:paused}
.player.playing .player-bg{animation-play-state:running}
@keyframes drift{from{transform:translate(-4%,-3%) scale(1)}to{transform:translate(5%,4%) scale(1.12)}}
.player-center{position:relative;text-align:center;padding:0 16px}
.player-center strong{display:block;font-size:clamp(16px,3.4cqw,26px)}
.player-center span{display:inline-block;margin-top:8px;font-size:13px;color:var(--text-dim);padding:4px 12px;border-radius:999px;background:var(--glass-hi)}
.big-play{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;background:rgba(0,0,0,.28)}
.big-play span{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--depiy-orange);color:var(--on-orange);box-shadow:0 10px 40px var(--orange-glow);padding-left:5px}
.player.playing .big-play{opacity:0;pointer-events:none}
.controls{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.controls input[type=range]{width:100%;accent-color:var(--depiy-orange)}
.ctl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.ctl{padding:7px 12px;border-radius:999px;background:var(--glass-hi);font-size:13px}
.ctl:hover{background:var(--orange-soft)}
.ctl.main{background:var(--depiy-orange);color:var(--on-orange);font-weight:800;min-width:48px}
.wtime{margin-left:auto;font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.viewers{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.viewers li{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px}
.viewers em{font-style:normal;font-size:11px;color:var(--ok)}
.viewers em.warn{color:var(--warn)}
.host-tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--orange-soft);color:var(--depiy-orange)}
.side-col{display:flex;flex-direction:column;height:min(580px,72vh);border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:12px 8px;font-size:13.5px;color:var(--text-dim);border-bottom:2px solid transparent}
.tab.active{color:var(--text);font-weight:700;border-bottom-color:var(--depiy-orange)}
.side-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px}
.side-body .stream-wrap{flex:1;min-height:0;display:flex}
.side-body .stream{flex:1;max-height:none}
.voice{display:flex;flex-direction:column;gap:14px}
.voice-head{display:flex;justify-content:space-between;align-items:baseline}
.voice-head small{color:var(--text-dim)}
.voice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.voice-p{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--text-dim)}
.voice-p .ring{width:48px;height:48px;font-size:24px}
.voice-note{margin:0;font-size:12.5px;line-height:1.55;color:var(--text-dim)}

/* 토스트 / 스크림 */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:120;padding:10px 18px;border-radius:999px;background:rgba(28,28,32,.96);border:1px solid var(--orange-line);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

/* ---------- 반응형 ---------- */
@media (max-width:1279px){
  .dp-app{grid-template-columns:70px 240px minmax(0,1fr)}
  .widget{display:none}
}

function friendlyError(e, fallback) {
  const m = (e && (e.message || e.error_description)) || '';
  console.warn(fallback, e);
  for (const k in SERVER_MSGS) if (m.includes(k)) return SERVER_MSGS[k];
  if (m.includes('rate_limited')) return '너무 빠르게 쓰고 있어요. 잠시 후 다시 시도해 주세요 ⏳';
  if ((e && e.code === '42501') || /row-level security|permission denied/i.test(m)) return '권한이 없거나 이용이 제한된 계정이에요';
  if (e && e.code === '23505') return /handle/.test(m) ? '이미 사용 중인 아이디예요' : /display_name/.test(m) ? '이미 사용 중인 닉네임이에요' : '이미 처리된 항목이에요';
  if (/Failed to fetch|NetworkError/i.test(m)) return '네트워크 연결을 확인해 주세요';
  return fallback;
}

function toPost(r) {
  const echo = !!r.echo_of;
  return {
    id: r.id, key: r.channel_id || 'plaza', ownerId: r.author_id,
    name: echo ? (r.orig_name || '알 수 없음') : (r.author_name || '알 수 없음'),
    handle: echo ? (r.orig_handle || '') : (r.author_handle || ''),
    role: echo ? (r.orig_role || 'member') : (r.author_role || 'member'),
    picture: echo ? r.orig_avatar : r.author_avatar,
    text: r.body || '', created: r.created_at, media: Array.isArray(r.media) ? r.media : [],
    sparks: Number(r.spark_count) || 0, sparked: !!r.sparked_by_me,
    echoes: Number(r.echo_count) || 0, threads: Number(r.thread_count) || 0,
    echoedTo: Array.isArray(r.echoed_to) ? r.echoed_to : [], rootId: r.echo_of || r.id,
    echoOf: r.echo_of || null,
    echo: echo ? { by: r.author_name || '알 수 없음', from: r.echo_from || '' } : null,
    echoRole: echo ? (r.author_role || 'member') : null,
    fresh: false
  };
}

async function loadSpaces() {
  const [sp, ch] = await Promise.all([
    sb.from('spaces').select('*').order('sort'),
    sb.from('channels').select('*').order('sort')
  ]);
  if (sp.error) throw sp.error; if (ch.error) throw ch.error;
  state.channels = {};
  (ch.data || []).forEach(c => { state.channels[c.id] = c; });
  state.spaces = (sp.data || []).map(s => ({
    id: s.id, name: s.name, icon: s.icon, desc: s.description || '',
    channels: (ch.data || []).filter(c => c.space_id === s.id).map(c => c.id)
  }));
  if (!state.spaces.some(s => s.id === state.spaceId)) state.spaceId = state.spaces[0] ? state.spaces[0].id : null;
}

async function loadFeed(key, more = false) {
  const f = getFeed(key);
  if (f.loading || (more && f.done)) return;
  f.loading = true; f.error = false;
  if (!more && feedKey() === key) refreshList(key);
  try {
    let q = sb.from('post_feed').select('*').order('created_at', { ascending: false }).limit(PAGE);
    q = key === 'plaza' ? q.is('channel_id', null) : q.eq('channel_id', key);
    if (more && f.items.length) q = q.lt('created_at', f.items[f.items.length - 1].created);
    const { data, error } = await q;
    if (error) throw error;
    const rows = (data || []).map(toPost);
    if (more) { const have = new Set(f.items.map(p => p.id)); f.items.push(...rows.filter(p => !have.has(p.id))); }
    else f.items = rows;
    f.done = rows.length < PAGE; f.loaded = true;
  } catch (e) { f.error = true; toast(friendlyError(e, '글을 불러오지 못했어요')); }
  f.loading = false;
  if (feedKey() === key) refreshList(key);
  renderWidget();
}

async function loadTrending() {
  try {
    const since = new Date(Date.now() - 7 * 864e5).toISOString();
    const { data } = await sb.from('post_feed').select('id,body,author_name,echo_count')
      .is('echo_of', null).gt('echo_count', 0).gt('created_at', since).order('echo_count', { ascending: false }).limit(3);
    state.trending = data || [];
  } catch (_) { state.trending = []; }
  renderWidget();
}

/* ================= 스파크 ================= */
function burst(x, y) {
  if (reduced()) return;
  const flash = document.createElement('span');
  flash.className = 'dp-flash'; flash.style.left = x - 22 + 'px'; flash.style.top = y - 22 + 'px';
  document.body.appendChild(flash);
  const fa = flash.animate([{ opacity: .9, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(2.4)' }], { duration: 450, easing: 'ease-out', fill: 'forwards' });
  fa.onfinish = () => flash.remove(); setTimeout(() => flash.remove(), 900);
  const n = 8 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');
    el.className = 'dp-p' + (i % 3 === 0 ? ' alt' : '');
    const ang = (Math.PI * 2 / n) * i + rand(-.25, .25), dist = rand(36, 80), size = rand(4, 8);
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = size + 'px'; el.style.height = (i % 4 === 0 ? size * 2.4 : size) + 'px';
    document.body.appendChild(el);
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const a = el.animate([
      { transform: `translate(-50%,-50%) translate(0,0) rotate(${ang}rad) scale(1)`, opacity: 1 },
      { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) rotate(${ang}rad) scale(.2)`, opacity: 0 }
    ], { duration: rand(520, 860), easing: 'cubic-bezier(.15,.8,.3,1)', fill: 'forwards' });
    a.onfinish = () => el.remove(); setTimeout(() => el.remove(), 1400);
  }
}

function refreshActions(id) {
  const p = findPost(id), art = $(`[data-post="${id}"]`);
  if (!p || !art) return;
  const s = $('.spark', art), e = $('.echo', art), t = $('.thread', art);
  s.classList.toggle('on', p.sparked); s.setAttribute('aria-pressed', p.sparked); s.setAttribute('aria-label', `스파크 ${p.sparks}개`); $('span', s).textContent = p.sparks;
  e.classList.toggle('on', p.echoedTo.length > 0); e.setAttribute('aria-label', `에코 ${p.echoes}회`); $('span', e).textContent = p.echoes;
  const open = state.openThreads.has(id);
  t.classList.toggle('on', open); t.setAttribute('aria-expanded', open); t.setAttribute('aria-label', `라이브 스레드 ${p.threads}개 메시지`); $('span', t).textContent = p.threads;
}

async function toggleSpark(id, ev, btn) {
  const p = findPost(id); if (!p || p.busy) return;
  p.busy = true;
  const was = p.sparked;
  p.sparked = !was; p.sparks = Math.max(0, p.sparks + (was ? -1 : 1)); refreshActions(id);
  if (!was) {
    const r = btn.getBoundingClientRect(); let x = ev.clientX, y = ev.clientY;
    if (!x && !y) { x = r.left + r.width / 2; y = r.top + r.height / 2; }
    burst(x, y); btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  }
  const { error } = was
    ? await sb.from('sparks').delete().eq('post_id', id).eq('user_id', state.me.id)
    : await sb.from('sparks').insert({ post_id: id });
  p.busy = false;
  if (error && error.code !== '23505') {
    p.sparked = was; p.sparks = Math.max(0, p.sparks + (was ? 1 : -1)); refreshActions(id);
    toast(friendlyError(error, '스파크를 처리하지 못했어요'));
  }
}

/* ================= 에코 ================= */
function closeEchoMenu() {
  const m = $('#echoMenu'); if (m) m.remove();
  $$('.act.echo[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
function openEchoMenu(id, btn) {
  const wasOpen = $('#echoMenu') && $('#echoMenu').dataset.id === id;
  closeEchoMenu(); if (wasOpen) return;
  const p = findPost(id), sp = curSpace(); if (!p || !sp) return;
  const dests = ['plaza', ...sp.channels];
  const menu = document.createElement('div');
  menu.id = 'echoMenu'; menu.className = 'echo-menu'; menu.dataset.id = id;
  menu.setAttribute('role', 'menu'); menu.setAttribute('aria-label', '에코할 곳 선택');
  menu.innerHTML = `<p class="em-title">📡 어디로 에코할까요?</p>` + dests.map(k => {
    const done = p.echoedTo.includes(k);
    return `<button role="menuitem" data-act="echoPick" data-id="${id}" data-dest="${esc(k)}">${esc(feedLabel(k))}${done ? '<small style="color:var(--depiy-orange);font-weight:700">✓ 에코됨 (취소)</small>' : ''}</button>`;
  }).join('');
  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = clamp(r.left, 8, innerWidth - mw - 8), top = r.bottom + 6;
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
  btn.setAttribute('aria-expanded', 'true');
  const first = $('button', menu); if (first) first.focus();
}

function ripple(x, y) {
  if (reduced()) return;
  for (let i = 0; i < 3; i++) {
    const r = document.createElement('span'); r.className = 'dp-ripple'; r.style.left = x + 'px'; r.style.top = y + 'px';
    document.body.appendChild(r);
    const a = r.animate([{ transform: 'translate(-50%,-50%) scale(.2)', opacity: .8 }, { transform: 'translate(-50%,-50%) scale(5)', opacity: 0 }], { duration: 900, delay: i * 180, easing: 'ease-out', fill: 'both' });
    a.onfinish = () => r.remove(); setTimeout(() => r.remove(), 1800);
  }
}

async function doEcho(id, dest) {
  closeEchoMenu();
  const p = findPost(id); if (!p || !state.me) return;
  const targetChannel = dest === 'plaza' ? null : dest;

  // 이미 에코한 곳이면 에코 취소 & 생성된 에코 게시물 삭제
  if (p.echoedTo.includes(dest)) {
    try {
      let q = sb.from('posts').delete().eq('author_id', state.me.id).eq('echo_of', p.rootId);
      if (dest === 'plaza') q = q.is('channel_id', null);
      else q = q.eq('channel_id', dest);
      const { error } = await q;
      if (error) throw error;

      allPosts().filter(x => x.rootId === p.rootId).forEach(x => {
        x.echoedTo = x.echoedTo.filter(d => d !== dest);
        x.echoes = Math.max(0, x.echoes - 1);
        refreshActions(x.id);
      });

      // 로컬 피드에서 내가 생성했던 해당 에코 글 제거
      for (const k in state.feeds) {
        state.feeds[k].items.filter(x => x.echoOf === p.rootId && x.ownerId === state.me.id && (dest === 'plaza' ? x.key === 'plaza' : x.key === dest))
          .forEach(match => removePostLocal(match.id));
      }

      toast(`📡 ${feedLabel(dest)} 에코를 취소했어요`);
      loadTrending();
    } catch (e) {
      toast(friendlyError(e, '에코 취소에 실패했어요'));
    }
    return;
  }

  // 신규 에코 등록
  try {
    const { data, error } = await sb.from('posts').insert({
      channel_id: targetChannel,
      body: p.text,
      media: p.media,
      echo_of: p.rootId,
      echo_from: feedLabel(p.key)
    }).select('id').single();
    if (error) throw error;
    allPosts().filter(x => x.rootId === p.rootId).forEach(x => {
      x.echoes++;
      if (!x.echoedTo.includes(dest)) x.echoedTo.push(dest);
      refreshActions(x.id);
    });
    const row = await fetchPostRow(data.id);
    if (row) addPostToFeed(toPost(row), true);
    const art = $(`[data-post="${id}"] .echo`);
    if (art) { const r = art.getBoundingClientRect(); ripple(r.left + r.width / 2, r.top + r.height / 2); }
    toast(`📡 ${feedLabel(dest)}에 에코했어요`);
    loadTrending();
  } catch (e) {
    toast(e && e.code === '23505' ? `이미 ${feedLabel(dest)}에 에코했어요` : friendlyError(e, '에코하지 못했어요'));
  }
}

/* ================= 글 추가 / 삭제 / 신고 ================= */
function addPostToFeed(p, own) {
  const f = getFeed(p.key);
  if (f.items.some(x => x.id === p.id)) return;
  f.items.unshift(p);
  if (feedKey() === p.key) {
    p.fresh = true;
    const list = $('#postList'); if (!list) return;
    const e = $('.empty', list); if (e) e.remove();
    list.insertAdjacentHTML('afterbegin', postHTML(p));
    if (own) { const sc = $('.dp-scroll'); if (sc) sc.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }); }
  }
}
function removePostLocal(id) {
  for (const k in state.feeds) state.feeds[k].items = state.feeds[k].items.filter(p => p.id !== id);
  const el = $(`[data-post="${id}"]`); if (el) el.remove();
  state.openThreads.delete(id); delete state.threads[id];
  if (feedKey() && !getFeed(feedKey()).items.length) refreshList(feedKey());
}
async function delPost(id) {
  const p = findPost(id);
  if (!confirm('이 글을 삭제할까요? 되돌릴 수 없어요.')) return;
  const isEchoPost = p && (!!p.echo || !!p.echoOf || (p.rootId && p.rootId !== p.id));
  const rootId = p ? p.rootId : null;
  const dest = p ? p.key : null;
  const wasMyEcho = isEchoPost && (p.ownerId === state.me?.id);

  const viaStaff = !!(p && state.me && p.ownerId !== state.me.id && isStaff());   // 남의 글을 지울 땐 운영 기록이 남도록 RPC 사용
  const { error } = viaStaff ? await sb.rpc('mod_delete_post', { p_post: id, p_note: '피드에서 삭제' }) : await sb.from('posts').delete().eq('id', id);
  if (error) {
    toast(friendlyError(error, '삭제하지 못했어요'));
  } else {
    removePostLocal(id);
    if (rootId) {
      allPosts().filter(x => x.rootId === rootId).forEach(x => {
        if (wasMyEcho && dest) x.echoedTo = x.echoedTo.filter(d => d !== dest);
        x.echoes = Math.max(0, x.echoes - 1);
        refreshActions(x.id);
      });
    }
    toast('🗑️ 삭제했어요');
    loadTrending();
  }
}
async function reportPost(id) {
  const reason = prompt('신고 사유를 간단히 적어 주세요 (스팸, 욕설, 불법 콘텐츠 등)');
  if (!reason || !reason.trim()) return;
  const { error } = await sb.from('reports').insert({ post_id: id, reason: reason.trim().slice(0, 300) });

/* ================= 미디어 첨부 ================= */
let stagedMedia = [];   // { file, type, preview }
let posting = false;
const ALLOWED = ['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'video/mp4', 'video/webm', 'video/quicktime'];

function handleMediaFiles(files) {
  for (const file of files) {
    if (stagedMedia.length >= MAX_MEDIA) { toast(`첨부는 최대 ${MAX_MEDIA}개까지예요`); break; }
    const ext = (file.name || '').split('.').pop().toLowerCase();
    const isVideo = file.type.startsWith('video/') || ['mp4', 'webm', 'mov'].includes(ext);
    const isImg = file.type.startsWith('image/') || ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext);
    if (!ALLOWED.includes(file.type) && !isVideo && !isImg) {
      toast('이미지나 동영상 파일(JPG/PNG/WEBP/GIF/MP4/WEBM)만 올릴 수 있어요');
      continue;
    }
    if (isVideo && file.size > MAX_VIDEO_MB * 1048576) { toast(`영상은 ${MAX_VIDEO_MB}MB 이하만 올릴 수 있어요`); continue; }
    if (file.type === 'image/gif' && file.size > MAX_GIF_MB * 1048576) { toast(`GIF는 ${MAX_GIF_MB}MB 이하만 올릴 수 있어요`); continue; }
    stagedMedia.push({ file, type: isVideo ? 'video' : 'image', preview: URL.createObjectURL(file) });
  }
  renderComposerMedia();
}
function removeStagedMedia(i) { const m = stagedMedia[i]; if (m) URL.revokeObjectURL(m.preview); stagedMedia.splice(i, 1); renderComposerMedia(); }
function clearStagedMedia() { stagedMedia.forEach(m => URL.revokeObjectURL(m.preview)); stagedMedia = []; renderComposerMedia(); }
function renderComposerMedia() {
  const box = $('#composerMediaPreview'), clr = $('#composerClearMedia'); if (!box) return;
  if (!stagedMedia.length) { box.style.display = 'none'; box.innerHTML = ''; if (clr) clr.style.display = 'none'; return; }
  box.style.display = 'flex'; if (clr) clr.style.display = 'inline-flex';
  box.innerHTML = stagedMedia.map((m, i) => `<div class="composer-media-item">${m.type === 'video' ? `<video src="${m.preview}" muted playsinline></video>` : `<img src="${m.preview}" alt="">`}<button type="button" class="composer-media-del" data-act="rmStaged" data-idx="${i}" aria-label="첨부 삭제">×</button></div>`).join('');
}
async function resizeImage(file) {
  if (file.type === 'image/gif') return { blob: file, ext: 'gif', mime: 'image/gif' };
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, MAX_IMG_PX / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
  if (!blob) throw new Error('이미지 변환 실패');
  return { blob, ext: 'jpg', mime: 'image/jpeg' };
}
async function uploadStaged() {
  const out = [];
  for (let i = 0; i < stagedMedia.length; i++) {
    const m = stagedMedia[i]; let blob = m.file, ext, mime = m.file.type;
    if (m.type === 'image') ({ blob, ext, mime } = await resizeImage(m.file));
    else ext = mime === 'video/webm' ? 'webm' : mime === 'video/quicktime' ? 'mov' : 'mp4';
    const path = `${state.me.id}/${Date.now()}-${i}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: mime, cacheControl: '31536000', upsert: false });
    if (error) throw error;
    out.push({ type: m.type, url: sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl });
  }
  return out;
}
async function submitPost(form) {
  if (posting) return;
  const ta = form.elements.text, text = ta.value.trim(), key = feedKey();
  if (!key || (!text && !stagedMedia.length)) return;
  const btn = $('#postSubmit'); posting = true; if (btn) { btn.disabled = true; btn.textContent = stagedMedia.length ? '업로드 중…' : '게시 중…'; }
  try {
    const media = await uploadStaged();
    const { data, error } = await sb.from('posts').insert({ channel_id: key === 'plaza' ? null : key, body: text, media }).select('id').single();
    if (error) throw error;
    const row = await fetchPostRow(data.id);
    ta.value = ''; clearStagedMedia();

/* ================= 닉네임 / 핸들 유효성 & 금칙어 규칙 ================= */
const STAFF_TERMS = ['admin', 'administrator', '관리자', '운영자', '어드민', 'staff', '운영진'];
const NICK_EXACT = ['depiy', 'depiyhub', '드피', '드피허브', 'mod', 'moderator', 'system', '시스템', 'support', 'official', '공식', 'root', '매니저', '운영', '관리'];
const HANDLE_STAFF = ['admin', 'administrator', 'staff'];
const HANDLE_EXACT = ['depiy', 'depiyhub', 'mod', 'moderator', 'system', 'support', 'official', 'root', 'help', 'team', 'everyone', 'here', 'channel'];
const LEET_MAP = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't' };
const ALLOWED_COMPOUNDS_RE = /(출시발|시발점|시발역)/g;   // 정상 단어는 욕설 검사에서 제외
const PROFANITY_RE = /(씨발|시발|시벌|씨벌|개새끼|병신|지랄|존나|썅|창녀)/;
const startsOrEnds = (s, terms) => terms.some(t => s.startsWith(t) || s.endsWith(t));
const leet = s => s.replace(/[013457]/g, c => LEET_MAP[c]);
const isAdminMe = () => !!(state.me && state.me.role === 'admin');

function sanitizeUnicode(str) {
  return String(str || '').normalize('NFKC').trim();
}

// ⚠️ 이 규칙은 depiy-hub-patch-v4.sql 의 nickname_problem / handle_problem 과 같아야 해요 (서버가 최종 판단)
function validateNickname(raw) {
  const name = sanitizeUnicode(raw);
  if (!name) return { ok: false, msg: '닉네임을 입력해 주세요' };
  if (/\s/.test(name)) return { ok: false, msg: '닉네임에 공백은 넣을 수 없어요' };
  if (name.length < 2 || name.length > 12) return { ok: false, msg: '닉네임은 2자 이상 12자 이하여야 해요' };
  if (/^[-_.]/.test(name)) return { ok: false, msg: '첫 글자는 특수문자(_ . -)로 시작할 수 없어요' };
  if (!/^[가-힣a-zA-Z0-9][가-힣a-zA-Z0-9_.-]{1,11}$/.test(name)) {
    return { ok: false, msg: '한글(완성형), 영문, 숫자, 특수문자(_ . -)만 사용할 수 있어요' };
  }
  const sk = name.toLowerCase().replace(/[_.-]/g, '');
  const skd = sk.replace(/[0-9]/g, '');            // 구분자·숫자 제거 (admin01 → admin)
  const skl = leet(sk).replace(/[0-9]/g, '');      // 숫자를 글자로 (adm1n → admin)
  if (!isAdminMe() && [skd, skl].some(s => startsOrEnds(s, STAFF_TERMS) || NICK_EXACT.includes(s))) {
    return { ok: false, msg: '운영/시스템과 헷갈릴 수 있어 사용할 수 없는 닉네임이에요' };
  }
  if (PROFANITY_RE.test(skd.replace(ALLOWED_COMPOUNDS_RE, ''))) {
    return { ok: false, msg: '부적절한 단어가 포함되어 있어요' };
  }
  return { ok: true, name };
}

function validateHandle(raw) {
  let h = sanitizeUnicode(raw).toLowerCase();
  if (h.startsWith('@')) h = h.slice(1);
  if (!h) return { ok: false, msg: '사용자 ID(핸들)를 입력해 주세요' };
  if (!/^[a-z0-9_]{3,15}$/.test(h)) return { ok: false, msg: '아이디는 3~15자의 영문 소문자, 숫자, _ 만 사용 가능해요' };
  const hk = h.replace(/[_0-9]/g, '');
  const hkl = leet(h).replace(/[_0-9]/g, '');
  if (!isAdminMe() && [hk, hkl].some(s => startsOrEnds(s, HANDLE_STAFF) || HANDLE_EXACT.includes(s))) {
    return { ok: false, msg: '사용할 수 없는 예약된 아이디예요' };
  }
  return { ok: true, handle: h };
}

// 중복·규칙 검사 (서버 RPC). true=사용 가능, false=사용 불가, null=서버 검사를 못 함
let rpcWarned = false;
async function rpcAvailable(fn, args) {
  if (!sb) return null;
  try {
    const { data, error } = await sb.rpc(fn, args);
    if (error) throw error;
    if (typeof data === 'boolean') return data;
  } catch (e) {
    if (!rpcWarned) { rpcWarned = true; console.warn(`[중복 검사] ${fn} 를 호출하지 못했어요. depiy-hub-patch-v4.sql 을 실행했는지 확인하세요.`, e); }
  }
  return null;
}
const isNicknameAvailable = (name, myId) => rpcAvailable('check_nickname_available', { p_name: name, p_id: myId || null });
const isHandleAvailable = (h, myId) => rpcAvailable('check_handle_available', { p_handle: h, p_id: myId || null });

// 캔버스 아바타 압축 리사이징 (256x256 max)
function compressAvatar(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const sz = Math.min(img.width, img.height);
        const sx = (img.width - sz) / 2, sy = (img.height - sz) / 2;
        const cvs = document.createElement('canvas');
        cvs.width = 256; cvs.height = 256;
        const ctx = cvs.getContext('2d');
        ctx.drawImage(img, sx, sy, sz, sz, 0, 0, 256, 256);
        cvs.toBlob(blob => {
          if (!blob) return reject(new Error('이미지 변환 실패'));
          resolve(blob);
        }, 'image/jpeg', 0.85);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleAvatarSelected(file) {

async function saveProfile() {
  const vNick = validateNickname($('#profileName').value);
  if (!vNick.ok) { toast(vNick.msg); return; }
  const vHandle = validateHandle($('#profileHandle').value);
  if (!vHandle.ok) { toast(vHandle.msg); return; }

  const btn = $('#btnSaveProfile'); if (btn) btn.disabled = true;
  let uploadedPath = null;
  try {
    const m = state.me, updates = {};

    if (vNick.name !== m.name) {
      if (nickCooldownLeft() > 0) { toast('닉네임은 7일에 1회만 변경할 수 있어요.'); return; }
      if (await isNicknameAvailable(vNick.name, m.id) === false) { toast('이미 사용 중이거나 사용할 수 없는 닉네임이에요.'); return; }
      updates.display_name = vNick.name;
    }
    if (vHandle.handle !== m.handle) {
      if (handleCooldownLeft() > 0) { toast('사용자 ID는 30일에 1회만 변경할 수 있어요.'); return; }
      if (await isHandleAvailable(vHandle.handle, m.id) === false) { toast('이미 사용 중이거나 사용할 수 없는 사용자 ID예요.'); return; }
      updates.handle = vHandle.handle;
    }
    if (!m.nicknameInitialized) updates.nickname_initialized = true;   // 처음 설정 완료 (시간 기록은 서버가 정해요)

    // 아바타 업로드: {내 ID}/avatar_{시각}.jpg  (경로가 매번 달라서 upsert 가 필요 없어요)
    const oldAvatar = m.avatar || '';
    if (stagedAvatarBlob) {
      const path = `${m.id}/avatar_${Date.now()}.jpg`;
      const { error: upErr } = await sb.storage.from('media').upload(path, stagedAvatarBlob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false });
      if (upErr) throw upErr;
      uploadedPath = path;
      updates.avatar_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
    }

    if (Object.keys(updates).length > 0) {
      const { data: row, error } = await sb.from('profiles').update(updates).eq('id', m.id).select('*').single();
      if (error) throw error;
      const r = row || {};
      m.name = r.display_name ?? updates.display_name ?? m.name;
      m.handle = r.handle ?? updates.handle ?? m.handle;
      m.avatar = r.avatar_url ?? updates.avatar_url ?? m.avatar;
      m.lastNickChange = r.last_nickname_changed_at ?? m.lastNickChange;
      m.lastHandleChange = r.last_handle_changed_at ?? m.lastHandleChange;
      m.nicknameInitialized = r.nickname_initialized ?? (updates.nickname_initialized || m.nicknameInitialized);
      uploadedPath = null;   // 저장 성공 → 업로드한 파일 유지
      // 예전 아바타 파일 정리 (내 폴더의 avatar_ 파일만)
      const marker = `/storage/v1/object/public/media/${m.id}/avatar_`;
      const at = oldAvatar.indexOf(marker);
      if (updates.avatar_url && at !== -1) {
        try { await sb.storage.from('media').remove([oldAvatar.slice(at + '/storage/v1/object/public/media/'.length)]); } catch (_) {}
      }
    }

    closeProfile();
    renderNav(); renderSpaces(); renderWidget(); trackPresence();
    allPosts().forEach(p => {
      if (p.ownerId === m.id && !p.echo) { p.name = m.name; p.handle = m.handle; if (m.avatar) p.picture = m.avatar; }
    });
    if (feedKey()) refreshList(feedKey());
    toast('✅ 프로필을 저장했어요');
  } catch (err) {
    if (uploadedPath) { try { await sb.storage.from('media').remove([uploadedPath]); } catch (_) {} }   // 저장 실패 시 고아 파일 정리
    toast(friendlyError(err, '프로필 저장에 실패했어요'));
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* ================= 실시간 (Realtime · Presence) ================= */
let dbChannel = null, presenceChannel = null;
const statTimers = new Map();
function scheduleStats(id) {
  if (!findPost(id)) return;
  clearTimeout(statTimers.get(id));
  statTimers.set(id, setTimeout(async () => {
    const { data } = await sb.from('post_feed').select('spark_count,thread_count,echo_count,echoed_to,sparked_by_me').eq('id', id).maybeSingle();
    if (!data) return;
    const root = findPost(id); if (!root) return;
    allPosts().filter(x => x.rootId === root.rootId).forEach(x => { x.echoes = Number(data.echo_count) || 0; refreshActions(x.id); });
    root.sparks = Number(data.spark_count) || 0; root.threads = Math.max(root.threads, Number(data.thread_count) || 0);
    if (!root.busy) root.sparked = !!data.sparked_by_me;
    root.echoedTo = data.echoed_to || root.echoedTo; refreshActions(id);
  }, 600));
}
const profileCache = new Map();
async function profileOf(id) {
  if (state.me && id === state.me.id) return { display_name: state.me.name, handle: state.me.handle, avatar_url: state.me.avatar };
  if (profileCache.has(id)) return profileCache.get(id);
  const { data } = await sb.from('profiles').select('display_name,handle,avatar_url').eq('id', id).maybeSingle();
  const v = data || { display_name: '알 수 없음', handle: '', avatar_url: null }; profileCache.set(id, v); return v;
}

function subscribeRealtime() {
  unsubscribeRealtime();
  dbChannel = sb.channel('db-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, async ({ new: r }) => {
      if (!r || (state.me && r.author_id === state.me.id)) return;
      if (r.echo_of) allPosts().filter(x => x.rootId === r.echo_of).forEach(x => scheduleStats(x.id));
      const key = r.channel_id || 'plaza', f = state.feeds[key];
      if (!f || !f.loaded || f.items.some(p => p.id === r.id)) return;
      try { const row = await fetchPostRow(r.id); if (row) addPostToFeed(toPost(row), false); } catch (_) {}
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'posts' }, ({ old: r }) => { if (r && r.id) removePostLocal(r.id); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sparks' }, ({ new: n, old: o }) => {
      const r = (n && n.post_id) ? n : o; if (!r || !r.post_id) return;
      if (state.me && r.user_id === state.me.id) return;
      scheduleStats(r.post_id);
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'thread_messages' }, async ({ new: r }) => {
      if (!r || !findPost(r.post_id)) return;
      if (state.me && r.author_id === state.me.id) return;
      const pr = await profileOf(r.author_id);
      pushThreadMsg(r.post_id, { id: r.id, userId: r.author_id, name: pr.display_name, picture: pr.avatar_url, text: r.body, created: r.created_at });
    })
    .subscribe();

  presenceChannel = sb.channel('presence-hub', { config: { presence: { key: state.me.id } } })
    .on('presence', { event: 'sync' }, () => {
      const st = presenceChannel.presenceState();
      state.online = Object.values(st).map(a => a && a[0]).filter(Boolean).map(u => ({ id: String(u.id || ''), name: String(u.name || '').slice(0, 24), avatar: httpsOnly(u.avatar) }));
      renderWidget();
      ensureRoles(state.online.map(u => u.id));
    })
    .subscribe(s => { if (s === 'SUBSCRIBED') trackPresence(); });
}
function trackPresence() { if (presenceChannel && state.me) presenceChannel.track({ id: state.me.id, name: state.me.name, avatar: state.me.avatar || '' }).catch(() => {}); }
function unsubscribeRealtime() {
  if (dbChannel) { sb.removeChannel(dbChannel); dbChannel = null; }
  if (presenceChannel) { sb.removeChannel(presenceChannel); presenceChannel = null; }
  state.online = [];
}

/* ================= 인증 (Supabase Auth · 비밀번호 / 이메일) ================= */
function setGate(show) {
  const g = $('#loginGate'); if (g) g.style.display = show ? 'flex' : 'none';
  document.body.classList.toggle('logged-out', show);
}
function gateMsg(text, isError = true) {
  const el = $('#gateMsg'); if (!el) return;
  el.hidden = !text; el.textContent = text || ''; el.classList.toggle('ok', !isError);
}

let gateEmailValue = '', resendUntil = 0, resendTimer = null;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function friendlyAuthError(e) {
  const m = (e && (e.message || e.error_description)) || '';
  if (/invalid login credentials|invalid credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않아요.';
  if (/user already registered/i.test(m)) return '이미 가입된 이메일이에요. 로그인 탭에서 로그인해 주세요.';
  if (/different from the old password/i.test(m)) return '이전과 다른 비밀번호를 입력해 주세요.';
  if (/password should be at least|weak_password|password is too weak/i.test(m)) return `비밀번호는 최소 ${PW_MIN}자리 이상이어야 해요. 너무 흔한 비밀번호도 쓸 수 없어요.`;
  if (/reauthenticat/i.test(m)) return '보안을 위해 다시 로그인한 뒤 시도해 주세요.';
  if (/auth session missing|not authenticated/i.test(m)) return '로그인이 만료됐어요. 다시 로그인해 주세요.';
  if (/rate limit|too many/i.test(m)) return '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.';
  if (/database error saving new user/i.test(m)) return '가입 처리 중 서버 오류가 났어요. 잠시 후 다시 시도해 주세요.';
  return m || '인증 처리에 실패했어요.';
}

const GATE_FORMS = { login: 'loginForm', signup: 'signupForm', magic: 'magicForm', code: 'codeForm', reset: 'resetForm', recovery: 'recoveryForm' };
function switchGateTab(tab) {
  Object.keys(GATE_FORMS).forEach(k => { const f = document.getElementById(GATE_FORMS[k]); if (f) f.hidden = k !== tab; });
  $$('.login-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const tabs = $('#gateTabs'); if (tabs) tabs.hidden = (tab === 'code' || tab === 'reset' || tab === 'recovery');
  gateMsg('');
  const focusId = { login: 'loginEmail', signup: 'signupEmail', magic: 'gateEmail', reset: 'resetEmail', recovery: 'recoveryPassword' }[tab];
  const el = focusId && document.getElementById(focusId); if (el) el.focus();
}

function showGateStep(step) {
  if (step === 'code') {
    switchGateTab('code');
    $('#gateSent').textContent = `${gateEmailValue} 로 인증 메일을 보냈어요. 메일의 인증 코드를 입력하거나 링크를 누르면 바로 입장돼요.`;
    $('#gateCode').value = ''; $('#gateCode').focus();
  } else {
    switchGateTab(step);
  }
}

// 비밀번호 재설정 메일 (가입 여부를 알려주지 않도록 항상 같은 안내를 해요)
let resetCooldownUntil = 0;
async function sendResetMail(email) {
  if (!sb) { gateMsg('서버 설정이 필요해요.'); return; }
  const em = String(email || '').trim().toLowerCase();
  if (!EMAIL_RE.test(em)) { gateMsg('올바른 이메일 주소를 입력해 주세요.'); return; }
  if (Date.now() < resetCooldownUntil) { gateMsg('잠시 후 다시 시도해 주세요. (메일은 1분에 1번만 보낼 수 있어요)'); return; }
  const btn = $('#btnReset'); if (btn) btn.disabled = true; gateMsg('');
  const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
  if (btn) btn.disabled = false;
  if (error && /rate limit|too many/i.test(error.message || '')) { gateMsg(friendlyAuthError(error)); return; }
  resetCooldownUntil = Date.now() + 60000;
  gateMsg('가입된 이메일이라면 재설정 메일을 보냈어요. 메일의 링크를 눌러 새 비밀번호를 정해 주세요. (스팸함도 확인해 보세요)', false);
}

// 재설정 링크로 들어왔을 때: 새 비밀번호 입력
let recoveryMode = false;
function showRecovery() { setGate(true); switchGateTab('recovery'); gateMsg('새 비밀번호를 입력해 주세요.', false); }
async function submitRecovery() {
  const p1 = $('#recoveryPassword').value, p2 = $('#recoveryPassword2').value;
  if (p1.length < PW_MIN) { gateMsg(`비밀번호는 최소 ${PW_MIN}자리 이상이어야 해요.`); return; }
  if (p1 !== p2) { gateMsg('두 비밀번호가 서로 달라요.'); return; }
  const btn = $('#btnRecovery'); if (btn) btn.disabled = true; gateMsg('');
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (btn) btn.disabled = false;
  if (error) { gateMsg(friendlyAuthError(error)); return; }
  recoveryMode = false; $('#recoveryPassword').value = ''; $('#recoveryPassword2').value = '';
  toast('🔑 새 비밀번호를 저장했어요');
  const { data } = await sb.auth.getSession();
  if (data && data.session) onSignedIn(data.session.user); else switchGateTab('login');
}

async function loginWithPassword(email, password) {
  if (!sb) { gateMsg('Supabase 설정이 필요해요.'); return; }
  const em = String(email || '').trim().toLowerCase();
  if (!EMAIL_RE.test(em)) { gateMsg('올바른 이메일 주소를 입력해 주세요.'); return; }
  if (!password) { gateMsg('비밀번호를 입력해 주세요.'); return; }

  const btn = $('#btnLogin'); if (btn) btn.disabled = true; gateMsg('');
  const { data, error } = await sb.auth.signInWithPassword({ email: em, password });
  if (btn) btn.disabled = false;
  if (error) { gateMsg(friendlyAuthError(error)); return; }
}

async function signupWithPassword(email, password, rawNick, rawHandle) {
  if (!sb) { gateMsg('Supabase 설정이 필요해요.'); return; }
  const em = String(email || '').trim().toLowerCase();
  if (!EMAIL_RE.test(em)) { gateMsg('올바른 이메일 주소를 입력해 주세요.'); return; }
  if (!password || password.length < PW_MIN) { gateMsg(`비밀번호는 최소 ${PW_MIN}자리 이상이어야 해요.`); return; }
  if (!$('#signupConsent').checked) { gateMsg('이용약관과 개인정보처리방침에 동의해 주세요.'); return; }

  const vNick = validateNickname(rawNick);
  if (!vNick.ok) { gateMsg(vNick.msg); return; }
  const vHandle = validateHandle(rawHandle);
  if (!vHandle.ok) { gateMsg(vHandle.msg); return; }

  const btn = $('#btnSignup'); if (btn) btn.disabled = true; gateMsg('');
  try {
    const availNick = await isNicknameAvailable(vNick.name);
    if (availNick === false) { gateMsg('이미 사용 중인 닉네임이에요.'); if (btn) btn.disabled = false; return; }

    const availHandle = await isHandleAvailable(vHandle.handle);
    if (availHandle === false) { gateMsg('이미 사용 중인 사용자 ID예요.'); if (btn) btn.disabled = false; return; }

    const { data, error } = await sb.auth.signUp({
      email: em,
      password,
      options: {
        data: { display_name: vNick.name, handle: vHandle.handle, full_name: vNick.name, terms_version: TERMS_VERSION },
        emailRedirectTo: location.origin + location.pathname
      }
    });
    if (error) { gateMsg(friendlyAuthError(error)); if (btn) btn.disabled = false; return; }

    if (!data.session) {
      gateEmailValue = em;
      showGateStep('code');
      gateMsg('인증 메일을 발송했어요. 메일의 링크를 누르거나 인증 코드를 입력해 주세요.', false);
    }
  } catch (err) {
    gateMsg(err.message || '가입에 실패했어요.');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function updateResendBtn() {
  const b = $('#btnResend'); if (!b) return;
  const left = Math.ceil((resendUntil - Date.now()) / 1000);
  if (left > 0) { b.disabled = true; b.textContent = `메일 다시 받기 (${left})`; }
  else { b.disabled = false; b.textContent = '메일 다시 받기'; clearInterval(resendTimer); resendTimer = null; }
}
function startResendCooldown(sec = 60) {
  resendUntil = Date.now() + sec * 1000; clearInterval(resendTimer);
  resendTimer = setInterval(updateResendBtn, 500); updateResendBtn();
}
async function sendCode(email, resend = false) {
  if (!sb) { gateMsg('서버 설정이 필요해요.'); return; }
  const em = String(email || '').trim().toLowerCase();
  if (!EMAIL_RE.test(em)) { gateMsg('이메일 주소를 확인해 주세요.'); return; }
  const btn = $('#btnSendCode'); if (btn) btn.disabled = true; gateMsg('');
  const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true, data: { terms_version: TERMS_VERSION } } });
  if (btn) btn.disabled = false;
  if (error) { gateMsg(friendlyAuthError(error)); return; }
  gateEmailValue = em; showGateStep('code'); startResendCooldown();
  if (resend) gateMsg('인증 메일을 다시 보냈어요.', false);
}
async function verifyCode(raw) {
  const token = String(raw || '').replace(/\s/g, '');
  if (!/^\d{6,12}$/.test(token)) { gateMsg('메일에 적힌 숫자 인증 코드를 입력해 주세요.'); return; }
  const btn = $('#btnVerify'); if (btn) btn.disabled = true; gateMsg('');
  let res = await sb.auth.verifyOtp({ email: gateEmailValue, token, type: 'email' });
  if (res.error) {
    res = await sb.auth.verifyOtp({ email: gateEmailValue, token, type: 'signup' });
  }
  if (btn) btn.disabled = false;
  if (res.error) gateMsg('코드가 맞지 않거나 만료됐어요. 메일의 링크를 눌러보거나 다시 받아 주세요.');
}
async function logout() {
  if (!confirm('로그아웃할까요?')) return;
  await sb.auth.signOut();
}

let signingIn = false;
/* ================= 약관 동의 · 비밀번호 변경 · 계정 삭제 ================= */
const needsConsent = () => !!(state.me && state.me.termsVersion !== TERMS_VERSION);
function showConsent() {
  const cb = $('#consentCheck'); if (cb) cb.checked = false;
  const b = $('#btnAcceptTerms'); if (b) b.disabled = true;
  $('#consentModal').classList.add('show');
}
function postSignInPrompts() {
  if (!state.me) return;
  if (needsConsent()) { showConsent(); return; }   // 약관에 동의하기 전에는 다른 안내를 띄우지 않아요
  if (!state.me.nicknameInitialized || !state.me.handle) {
    setTimeout(() => { openProfile(); toast('🎉 환영해요! 커뮤니티에서 사용할 닉네임과 사용자 ID를 설정해 주세요.'); }, 300);
  }
}
async function acceptTerms() {
  const cb = $('#consentCheck'); if (!cb || !cb.checked) return;
  const btn = $('#btnAcceptTerms'); if (btn) btn.disabled = true;
  const { error } = await sb.rpc('accept_terms', { p_version: TERMS_VERSION });
  if (error) { if (btn) btn.disabled = false; toast(friendlyError(error, '동의를 저장하지 못했어요')); return; }
  state.me.termsVersion = TERMS_VERSION;
  $('#consentModal').classList.remove('show');
  postSignInPrompts();
}
async function declineTerms() {
  $('#consentModal').classList.remove('show');
  try { await sb.auth.signOut(); } catch (_) {}
}

async function changePassword() {
  const inp = $('#newPassword'); const pw = inp.value;
  if (pw.length < PW_MIN) { toast(`비밀번호는 최소 ${PW_MIN}자리 이상이어야 해요`); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { toast(friendlyAuthError(error)); return; }
  inp.value = ''; toast('🔑 비밀번호를 저장했어요');
}

async function removeMyFiles() {
  const uid = state.me.id;
  for (let guard = 0; guard < 50; guard++) {          // 100개씩, 최대 5,000개
    const { data, error } = await sb.storage.from(BUCKET).list(uid, { limit: 100 });
    if (error || !data || !data.length) break;
    const paths = data.filter(o => o && o.name).map(o => `${uid}/${o.name}`);
    if (!paths.length) break;
    const { error: rmErr } = await sb.storage.from(BUCKET).remove(paths);
    if (rmErr) break;
  }
}
let deleting = false;
async function deleteMyAccount() {
  if (deleting) return;
  if ($('#deleteConfirmInput').value.trim() !== '삭제') { toast('확인란에 "삭제"라고 입력해 주세요'); return; }
  if (!confirm('정말 계정을 영구 삭제할까요?\n글, 사진, 프로필이 모두 사라지고 되돌릴 수 없어요.')) return;
  deleting = true;
  const btn = $('#btnDeleteAccount'); if (btn) btn.disabled = true;
  try {
    await removeMyFiles();                                    // 첨부·아바타 파일 먼저 삭제
    const { error } = await sb.rpc('delete_my_account');      // 계정 + 프로필 + 글 + 댓글 삭제
    if (error) throw error;
    try { await sb.auth.signOut({ scope: 'local' }); } catch (_) {}
    toast('계정을 삭제했어요. 그동안 이용해 주셔서 감사해요 🙏');
  } catch (e) {
    toast(friendlyError(e, '계정을 삭제하지 못했어요'));
  } finally {
    deleting = false; if (btn) btn.disabled = false;
  }
}

/* ================= 접속자 역할(👑) — profiles 에서 조회 ================= */
async function ensureRoles(ids) {
  if (!sb || !state.me) return;
  const need = [...new Set(ids)].filter(id => id && !roleCache.has(id)).slice(0, 100);
  if (!need.length) return;
  try {
    const { data, error } = await sb.from('profiles').select('id,role').in('id', need);
    if (error) throw error;
    (data || []).forEach(r => roleCache.set(r.id, r.role || 'member'));
    need.forEach(id => { if (!roleCache.has(id)) roleCache.set(id, 'member'); });
    renderWidget();
  } catch (e) { console.warn('역할 조회 실패', e); }
}

let pendingGateMsg = '';   // 로그아웃으로 게이트가 다시 그려져도 사라지지 않게 보관하는 안내 메시지
async function failSignIn(msg) {
  state.me = null; pendingGateMsg = msg; gateMsg(msg);
  try { await sb.auth.signOut(); } catch (_) {}
}
async function onSignedIn(user) {
  if (signingIn || (state.me && state.me.id === user.id)) return;
  signingIn = true;
  try {
    let prof = null;
    for (let i = 0; i < 4 && !prof; i++) {
      const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      prof = data; if (!prof) await new Promise(r => setTimeout(r, 400));
    }
    if (!prof) throw new Error('프로필을 불러오지 못했어요');
    if (prof.banned) { await failSignIn('이용이 제한된 계정이에요.'); return; }

    // 닉네임·아이디 검증은 서버(가입 트리거)가 해요. 가입 정보(metadata)는 여기서 믿지 않아요.
    state.me = {
      id: user.id,
      name: prof.display_name || '드피',
      handle: prof.handle || '',
      avatar: prof.avatar_url,
      role: prof.role,
      email: user.email || '',
      lastNickChange: prof.last_nickname_changed_at || null,
      lastHandleChange: prof.last_handle_changed_at || null,
      nicknameInitialized: !!prof.nickname_initialized,
      createdAt: prof.created_at,
      termsVersion: prof.terms_version || ''
    };

    await loadSpaces();
    state.view = 'plaza'; state.channelId = null;
    gateMsg(''); setGate(false);
    history.replaceState(null, '', location.pathname);
    renderSpaces(); renderNav(); renderMain(); renderWidget(); icons();
    subscribeRealtime(); loadTrending();

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-lightbox], [data-tab], .bnav-item, #btnCloseLightbox, #composerClearMedia');
  if (!t) { closeEchoMenu(); if (e.target === $('#profileModal')) closeProfile(); if (e.target === $('#legalModal')) closeLegal(); if (e.target === $('#lightbox')) closeLightbox(); return; }
  if (t.id === 'btnCloseLightbox') return closeLightbox();
  if (t.id === 'composerClearMedia') return clearStagedMedia();
  if (t.dataset.lightbox) return openLightbox(t.dataset.lightbox);
  if (t.classList.contains('bnav-item')) return handleBNav(t.dataset.bnavAct);
  if (t.dataset.tab) return switchGateTab(t.dataset.tab);

  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'switchTab': switchGateTab(t.dataset.to); break;
    case 'resendCode': sendCode(gateEmailValue, true); break;
    case 'logout': logout(); break;
    case 'drawer': document.body.classList.toggle('drawer-open'); break;
    case 'scrim': closeDrawer(); break;
    case 'go': go(t.dataset.view, id); break;
    case 'space': { const s = state.spaces.find(x => x.id === id); if (s) { state.spaceId = id; if (state.view === 'channel' && !s.channels.includes(state.channelId)) { state.view = 'plaza'; } closeEchoMenu(); renderSpaces(); renderNav(); renderMain(); closeDrawer(); } break; }
    case 'spark': toggleSpark(id, e, t); break;
    case 'echo': openEchoMenu(id, t); break;
    case 'echoPick': doEcho(id, t.dataset.dest); break;
    case 'thread': toggleThread(id); break;
    case 'delPost': delPost(id); break;
    case 'report': reportPost(id); break;
    case 'more': loadFeed(feedKey(), true); break;
    case 'retry': { const k = feedKey(); if (k) { getFeed(k).loaded = false; loadFeed(k); } break; }
    case 'rmStaged': removeStagedMedia(Number(t.dataset.idx)); break;
    case 'profile': openProfile(); break;
    case 'triggerAvatar': { const f = $('#profileAvatarInput'); if (f) f.click(); } break;
    case 'saveProfile': saveProfile(); break;
    case 'closeProfile': closeProfile(); break;
    case 'showTerms': openLegal('terms'); break;
    case 'showPrivacy': openLegal('privacy'); break;
    case 'closeLegal': closeLegal(); break;
    case 'acceptTerms': acceptTerms(); break;
    case 'declineTerms': declineTerms(); break;
    case 'changePassword': changePassword(); break;
    case 'deleteAccount': deleteMyAccount(); break;
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'post') submitPost(f);
  else if (f.dataset.form === 'send') sendThread(f);
  else if (f.dataset.form === 'login') loginWithPassword($('#loginEmail').value, $('#loginPassword').value);
  else if (f.dataset.form === 'signup') signupWithPassword($('#signupEmail').value, $('#signupPassword').value, $('#signupNickname').value, $('#signupHandle').value);

  else if (f.dataset.form === 'reset') sendResetMail($('#resetEmail').value);

document.addEventListener('keydown', e => {

// 실시간 유효성 디바운스 검사
const debounceTimers = {};
function showStatus(el, kind, text) { el.textContent = text; el.className = 'field-status ' + kind; }
document.addEventListener('input', e => {
  const id = e.target.id;
  const isNick = id === 'signupNickname' || id === 'profileName';
  const isHandle = id === 'signupHandle' || id === 'profileHandle';
  if (!isNick && !isHandle) return;
  const status = $('#' + ({ signupNickname: 'signupNickStatus', profileName: 'profileNickStatus', signupHandle: 'signupHandleStatus', profileHandle: 'profileHandleStatus' })[id]);
  if (!status) return;
  clearTimeout(debounceTimers[id]);
  const value = e.target.value;
  debounceTimers[id] = setTimeout(async () => {
    const v = isNick ? validateNickname(value) : validateHandle(value);
    if (!v.ok) { showStatus(status, 'err', v.msg); return; }
    showStatus(status, 'warn', '중복 검사 중…');
    const myId = id.startsWith('profile') && state.me ? state.me.id : null;
    const avail = isNick ? await isNicknameAvailable(v.name, myId) : await isHandleAvailable(v.handle, myId);
    if (e.target.value !== value) return;   // 그 사이 입력이 바뀌었으면 결과를 버려요
    if (avail === false) showStatus(status, 'err', isNick ? '이미 사용 중이거나 사용할 수 없는 닉네임이에요' : '이미 사용 중이거나 사용할 수 없는 아이디예요');
    else if (avail === null) showStatus(status, 'warn', '서버 중복 검사를 못 했어요. 저장할 때 최종 확인해요');
    else showStatus(status, 'ok', isNick ? '사용 가능한 닉네임이에요' : `사용 가능한 아이디예요 (@${v.handle})`);
  }, 350);
});

async function loadAdminUsers() {
  const raw = (state.admin.q || '').trim();
  const safe = raw.replace(/^@/, '').replace(/[^가-힣a-zA-Z0-9_.-]/g, '').slice(0, 20);
  let rows = [];
  const cols = 'id,display_name,handle,avatar_url,role,banned,created_at';
  if (safe) {
    const pat = '%' + safe.replace(/[\\%_]/g, c => '\\' + c) + '%';
    const [a, b] = await Promise.all([
      sb.from('profiles').select(cols).ilike('display_name', pat).limit(20),
      sb.from('profiles').select(cols).ilike('handle', pat).limit(20)
    ]);
    if (a.error) throw a.error; if (b.error) throw b.error;
    const seen = new Set();
    [...(a.data || []), ...(b.data || [])].forEach(u => { if (!seen.has(u.id)) { seen.add(u.id); rows.push(u); } });
  } else {
    const { data, error } = await sb.from('profiles').select(cols).order('created_at', { ascending: false }).limit(20);
    if (error) throw error; rows = data || [];
  }
  const body = adminBodyFor('users'); if (!body) return;
  body.innerHTML = `<form class="admin-search" data-adm-form="userSearch"><input id="admUserQ" value="${esc(raw)}" maxlength="20" placeholder="닉네임 또는 @아이디 검색" autocomplete="off"><button class="btn sm" type="submit">검색</button></form>
    <p class="field-hint">${safe ? `"${esc(safe)}" 검색 결과` : '최근 가입한 이용자'}</p>` +
    (rows.length ? rows.map(u => {
      const mine = u.id === state.me.id;

      return `<article class="admin-card"><div class="admin-user">
          <span class="av" aria-hidden="true">${avatarHTML(u.avatar_url, u.display_name)}</span>
          <div class="grow">${userLine(u)}${mine ? ' (나)' : ''}<br><small class="meta">가입 ${timeAgo(u.created_at)}</small></div>
          <div class="admin-actions">
            ${canTouch ? `<button type="button" class="btn sm ${u.banned ? '' : 'ghost'}" data-adm="${u.banned ? 'unban' : 'ban'}" data-user="${u.id}">${u.banned ? '✅ 차단 해제' : '🚫 차단'}</button>` : ''}

            ${isAdminMe() && !mine && u.role !== 'admin' ? `<button type="button" class="btn sm ghost" data-adm="role" data-user="${u.id}" data-role="${u.role === 'mod' ? 'member' : 'mod'}">${u.role === 'mod' ? '🛡️ 운영진 해제' : '🛡️ 운영진 지정'}</button>` : ''}
          </div></div></article>`;
    }).join('') : '<div class="empty">검색 결과가 없어요</div>');
}

const nextSort = list => (list.reduce((mx, x) => Math.max(mx, Number(x.sort) || 0), 0) + 1);
function askText(label, def, max, { required = true } = {}) {
  const v = prompt(`${label} (최대 ${max}자)`, def || '');
  if (v === null) return null;
  const t = v.trim();
  if (required && !t) { toast('내용을 입력해 주세요'); return null; }
  if (t.length > max) { toast(`${max}자 이하로 입력해 주세요`); return null; }
  return t;
}

  const icon = askText('아이콘(이모지 1개)', '🌐', 4); if (icon === null) return;
  const description = askText('설명(비워도 돼요)', '', 60, { required: false }); if (description === null) return;
  const { error } = await sb.from('spaces').insert({ id, name, icon, description, sort: nextSort(state.spaces.map(s => ({ sort: s.sort }))) });
  if (error) throw error;
  toast('스페이스를 만들었어요'); await refreshStructure();
}
async function adminEditSpace(id) {
  const sp = state.spaces.find(s => s.id === id); if (!sp) return;
  const name = askText('스페이스 이름', sp.name, 20); if (name === null) return;
  const icon = askText('아이콘(이모지 1개)', sp.icon, 4); if (icon === null) return;
  const description = askText('설명(비워도 돼요)', sp.desc, 60, { required: false }); if (description === null) return;
  const { error } = await sb.from('spaces').update({ name, icon, description }).eq('id', id);
  if (error) throw error;
  toast('스페이스를 수정했어요'); await refreshStructure();
}

/* ---- 기록 ---- */
async function loadAdminLogs() {
  const { data, error } = await sb.from('mod_log').select('*').order('created_at', { ascending: false }).limit(50);
  if (error) throw error;
  const rows = data || [];
  const pm = await profilesByIds(rows.flatMap(r => [r.actor_id, r.target_user]));
  const body = adminBodyFor('logs'); if (!body) return;
  body.innerHTML = rows.length ? rows.map(r => {
    const note = r.action === 'set_role' ? (ROLE_LABELS[r.note] || r.note || '') : (r.action.startsWith('report_') ? '' : (r.note || ''));
    return `<div class="admin-log"><b>${esc(LOG_LABELS[r.action] || r.action)}</b> · ${timeAgo(r.created_at)}<br>
      ${pm.get(r.actor_id) ? esc(pm.get(r.actor_id).display_name) : '(알 수 없음)'}${r.target_user ? ` → ${pm.get(r.target_user) ? esc(pm.get(r.target_user).display_name) : '(탈퇴한 이용자)'}` : ''}${note ? ` · ${esc(note)}` : ''}</div>`;
  }).join('') : '<div class="empty">아직 운영 기록이 없어요</div>';
}

/* ---- 관리자 패널 이벤트 ---- */
async function runAdm(t) {
  const a = t.dataset.adm;
  if (a === 'tab') { state.admin.tab = t.dataset.admTab; renderAdmin(); return; }
  if (a === 'toggleResolved') { state.admin.showResolved = !state.admin.showResolved; loadAdminTab(); return; }
  if (a === 'reload') { loadAdminTab(); return; }
  if (a === 'delPost') {
    if (!confirm('이 글을 삭제하고 신고를 처리할까요?')) return;
    const { error } = await sb.rpc('mod_delete_post', { p_post: t.dataset.post, p_note: '신고 처리' });
    if (error) throw error;
    removePostLocal(t.dataset.post); toast('🗑️ 글을 삭제했어요'); await refreshReportCount(); loadAdminTab(); return;
  }
  if (a === 'resolve') {
    const { error } = await sb.rpc('mod_resolve_report', { p_report: t.dataset.report, p_resolution: t.dataset.res });
    if (error) throw error;
    toast('신고를 처리했어요'); await refreshReportCount(); loadAdminTab(); return;
  }
  if (a === 'ban' || a === 'unban') {
    const ban = a === 'ban';
    if (!confirm(ban ? '이 이용자를 차단할까요?\n글쓰기·스파크·댓글이 모두 막히고 로그인도 되지 않아요.' : '이 이용자의 차단을 해제할까요?')) return;
    const note = prompt('사유 (운영 기록에 남아요, 비워도 돼요)', ''); if (note === null) return;
    const { error } = await sb.rpc('mod_set_ban', { p_user: t.dataset.user, p_banned: ban, p_note: note.trim().slice(0, 300) });
    if (error) throw error;
    toast(ban ? '🚫 차단했어요' : '✅ 차단을 해제했어요'); loadAdminTab(); return;
  }
  if (a === 'purge') {
    if (!confirm('이 사람이 쓴 모든 글을 삭제할까요? 되돌릴 수 없어요.')) return;
    const { data, error } = await sb.rpc('mod_purge_user_posts', { p_user: t.dataset.user, p_note: '운영진 일괄 삭제' });
    if (error) throw error;
    Object.keys(state.feeds).forEach(k => { state.feeds[k].loaded = false; });
    toast(`🧹 ${Number(data) || 0}개의 글을 삭제했어요`); await refreshReportCount(); loadAdminTab(); return;
  }
  if (a === 'role') {
    const role = t.dataset.role;
    if (!confirm(role === 'mod' ? '이 이용자를 운영진으로 지정할까요?\n신고 처리, 글 삭제, 이용자 차단을 할 수 있게 돼요.' : '운영진 권한을 해제할까요?')) return;
    const { error } = await sb.rpc('admin_set_role', { p_user: t.dataset.user, p_role: role });
    if (error) throw error;
    toast('권한을 변경했어요'); loadAdminTab(); return;
  }
  if (a === 'addChannel') return adminAddChannel(t.dataset.space);
  if (a === 'editChannel') return adminEditChannel(t.dataset.ch);
  if (a === 'delChannel') return adminDelChannel(t.dataset.ch);
  if (a === 'addSpace') return adminAddSpace();
  if (a === 'editSpace') return adminEditSpace(t.dataset.space);
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-adm]');
  if (!t || !state.me || !isStaff()) return;
  if (t.disabled) return;
  t.disabled = true;
  try { await runAdm(t); }
  catch (err) { toast(friendlyError(err, '처리하지 못했어요')); }
  finally { t.disabled = false; }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-adm-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.admForm === 'userSearch') { state.admin.q = $('#admUserQ').value; loadAdminTab(); }
});

/* ================= 시작 ================= */
function boot() {
  renderSpaces(); renderNav(); renderMain(); renderWidget();
  const urlInfo = (location.hash || '') + '&' + (location.search || '');
  if (/type=recovery/.test(urlInfo)) recoveryMode = true;                      // 비밀번호 재설정 링크로 들어옴
  if (/error_code=otp_expired|error=access_denied/.test(urlInfo)) {            // 만료된 메일 링크
    setTimeout(() => gateMsg('링크가 만료되었거나 이미 사용됐어요. 다시 받아 주세요.'), 0);
    history.replaceState(null, '', location.pathname);
  }
  if (!sb) {
    setGate(true);
    gateMsg(CONFIGURED ? 'Supabase 라이브러리를 불러오지 못했어요. 네트워크를 확인해 주세요.' : '⚙️ 서버 설정이 필요해요. 파일 상단의 SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY 를 입력해 주세요.');
    return;
  }
  // 콜백 안에서 직접 쿼리하면 supabase-js 가 교착될 수 있어서 setTimeout 으로 한 틱 미룸
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if (event === 'PASSWORD_RECOVERY') { recoveryMode = true; showRecovery(); return; }
      if (event === 'SIGNED_OUT') { recoveryMode = false; onSignedOut(); }
      else if (session && session.user && (event === 'INITIAL_SESSION' || event === 'SIGNED_IN')) {
        if (recoveryMode) { showRecovery(); return; }                          // 새 비밀번호를 정하기 전에는 입장시키지 않아요
        onSignedIn(session.user);
      }
      else if (event === 'INITIAL_SESSION' && !session) setGate(true);
    }, 0);
  });
}
boot();
})();
